<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">examcheat — SpeedExam answers on a stealth HUD</title>
  <desc id="desc">Left: project name and plain-language value. Right: a mock of the always-on-top HUD panel showing a green answer pick, with a small flow from exam page through GLM to the HUD.</desc>

  <rect width="1200" height="380" rx="26" fill="#0b0f0d"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#1d2620" stroke-width="2"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#7d8f82">SPEEDEXAM · CDP · Z.AI GLM</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#eef4ef">examcheat</text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#c3d0c7">Reads each SpeedExam question, asks GLM for the</text>
    <text x="0" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#c3d0c7">correct option, shows it on a stealth HUD.</text>
    <text x="0" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7d8f82">It never clicks and never navigates — you do.</text>
  </g>

  <!-- proof: HUD mock + flow -->
  <g id="project-proof" transform="translate(820 108)">
    <!-- HUD panel mock -->
    <rect x="0" y="0" width="340" height="92" rx="14" fill="#101512" stroke="#2c3a30" stroke-width="2"/>
    <circle cx="22" cy="30" r="5" fill="#3fb950"/>
    <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7d8f82">LIVE</text>
    <text x="22" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#56d364">B. duodenal atresia (0.99)</text>
    <text x="22" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7d8f82">NSPanel · sharing off · click-through</text>

    <!-- flow chips -->
    <g transform="translate(0 168)">
      <rect x="0" y="0" width="112" height="46" rx="10" fill="#141a16" stroke="#26332a" stroke-width="2"/>
      <text x="56" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle" fill="#c3d0c7">question</text>
      <path d="M118 23 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#3fb950" stroke-width="2"/>
      <rect x="146" y="0" width="104" height="46" rx="10" fill="#141a16" stroke="#26332a" stroke-width="2"/>
      <text x="198" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle" fill="#c3d0c7">GLM-5.3</text>
      <path d="M256 23 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#3fb950" stroke-width="2"/>
      <rect x="284" y="0" width="56" height="46" rx="10" fill="#14261a" stroke="#2f5c3a" stroke-width="2"/>
      <text x="312" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle" fill="#56d364">HUD</text>
    </g>
  </g>
</svg>
